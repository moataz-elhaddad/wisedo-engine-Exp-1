name: Deploy Exp-1 to Cloudflare
# Experiment 1 (Experiment B: multi-source product sourcing) ONLY. A separate Cloudflare project:
#   staging     Worker wisedo-engine-exp-1-staging  + D1 wisedo-engine-exp-1-staging
#   production  Worker wisedo-engine-exp-1          + D1 wisedo-engine-exp-1
# scripts/check-isolation.mjs runs before anything touches Cloudflare and refuses any original Wisedo resource.
# Promote by running "staging" first, then "production".
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   deploy (token scopes: Workers Scripts Edit, D1 Edit)
#   WISEDO_ADMIN_TOKEN                            24+ characters; unlocks discovery runs and admin routes
#   GEMINI_API_KEY, GROQ_API_KEY, COHERE_API_KEY, TAVILY_API_KEY, SERPER_API_KEY   discovery providers (each optional)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      reset_catalog:
        description: Replace the SKU store with the sample data (edits are lost)
        type: boolean
        default: false
      live_run:
        description: Run one real multi-source discovery request after deploying
        type: boolean
        default: true
concurrency: deploy-exp-1-${{ inputs.target }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolation guard (Exp-1 resources only)
        run: node scripts/check-isolation.mjs --env "$TARGET"
      - name: Resolve target
        run: |
          set -eu
          if [ "$TARGET" = production ]; then
            echo "WORKER=wisedo-engine-exp-1" >> "$GITHUB_ENV"; echo "DBNAME=wisedo-engine-exp-1" >> "$GITHUB_ENV"; echo "ENVFLAG=" >> "$GITHUB_ENV"
          else
            echo "WORKER=wisedo-engine-exp-1-staging" >> "$GITHUB_ENV"; echo "DBNAME=wisedo-engine-exp-1-staging" >> "$GITHUB_ENV"; echo "ENVFLAG=--env staging" >> "$GITHUB_ENV"
          fi
      - name: Clean and check Cloudflare secrets (values are never printed)
        run: |
          set -eu
          raw=$CLOUDFLARE_API_TOKEN
          tok=$(printf '%s' "$raw" | LC_ALL=C tr -cd 'A-Za-z0-9_-'); tok=${tok#Bearer}
          acc=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | LC_ALL=C tr -cd 'a-fA-F0-9' | tr 'A-F' 'a-f')
          if [ -n "$tok" ]; then echo "::add-mask::$tok"; fi
          if [ -n "$acc" ]; then echo "::add-mask::$acc"; fi
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$acc" >> "$GITHUB_ENV"
          bad=""
          [ ${#tok} -ge 40 ] || bad="$bad CLOUDFLARE_API_TOKEN(missing or not an API token)"
          [ ${#acc} -eq 32 ] || bad="$bad CLOUDFLARE_ACCOUNT_ID(missing or not 32 hex characters)"
          if [ -n "$bad" ]; then echo "::error::Missing or invalid secrets:$bad"; exit 1; fi
      - name: Admin token (repository secret, or a one-off token for this deploy)
        env:
          ADMIN: ${{ secrets.WISEDO_ADMIN_TOKEN }}
        run: |
          ADMIN=$(printf '%s' "$ADMIN" | tr -d '[:space:]')
          if [ ${#ADMIN} -lt 24 ]; then
            # No usable secret: generate a random token so the deploy and the smoke run can proceed. It is masked and
            # never printed; discovery from the web page needs the repository secret (set it and redeploy).
            echo "::warning::WISEDO_ADMIN_TOKEN is missing or shorter than 24 characters (found ${#ADMIN}); using a one-off generated token for this deploy"
            ADMIN=$(openssl rand -hex 24)
          fi
          echo "::add-mask::$ADMIN"
          echo "ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"
      - name: Tests (all must pass before deploying)
        run: node --test test/
      - name: Build pages
        run: sh web/build.sh dist
      - name: Install wrangler
        run: npm install --no-audit --no-fund
      - name: Apply D1 migrations (Exp-1 database only)
        run: |
          node scripts/check-isolation.mjs --env "$TARGET"
          npx wrangler d1 migrations apply "$DBNAME" --remote $ENVFLAG
      - name: Deploy Worker and pages
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy $ENVFLAG 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "No workers.dev URL in deploy output" >&2; exit 1; }
          case "$url" in "https://$WORKER."*) ;; *) echo "::error::deployed URL $url is not the $WORKER Worker"; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Set Worker secrets (values are never printed; empty ones are skipped)
        env:
          WISEDO_ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -eu
          for name in WISEDO_ADMIN_TOKEN GEMINI_API_KEY GROQ_API_KEY COHERE_API_KEY TAVILY_API_KEY SERPER_API_KEY; do
            val=$(printenv "$name" | tr -d '[:space:]' || true)
            if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler secret put "$name" $ENVFLAG >/dev/null && echo "$name: set"
            else echo "$name: not provided (that provider stays off)"; fi
          done
      - name: Smoke checks (engine, catalog, Layer 1)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ADMIN: ${{ env.ADMIN_TOKEN }}
          RESET: ${{ inputs.reset_catalog }}
        run: |
          set -eu
          ADMIN=$(printf '%s' "$ADMIN" | tr -d '[:space:]')
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in $(seq 1 36); do
            if curl -sf "$URL/api/health" -o health.json; then break; fi
            echo "waiting for $URL ($i/36)"; sleep 10
          done
          cat health.json; echo
          for i in $(seq 1 12); do
            [ "$(code -H "Authorization: Bearer $ADMIN" "$URL/api/admin/check")" = 200 ] && break
            echo "waiting for the admin token ($i/12)"; sleep 5
          done
          [ "$(code -H "Authorization: Bearer $ADMIN" "$URL/api/admin/check")" = 200 ]
          [ "$(code -X POST "$URL/api/admin/reset")" = 401 ] && echo "reset without token: 401"
          n=$(python3 -c 'import json;print(json.load(open("health.json"))["counts"]["products"])')
          if [ "$RESET" = "true" ] || [ "$n" = "0" ]; then curl -sf -X POST -H "Authorization: Bearer $ADMIN" "$URL/api/admin/reset"; echo; fi
          python3 -c 'import json,sys;h=json.load(open("health.json"));print("experiment:", h.get("experiment"))'
          [ "$(code "$URL/")" = 200 ] && echo "try-out page: 200"
          [ "$(code "$URL/expb.html")" = 200 ] && echo "expb page: 200"
          curl -sf -X POST -H 'content-type: application/json' -d '{"event":{"type":"start","tile":"laptop"}}' "$URL/api/session" -o s.json
          python3 -c 'import json;d=json.load(open("s.json"));print("session screen:", d["ui"]["screen"]);assert d["ui"]["screen"]!="error"'
          echo "### Exp-1 $TARGET: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Experiment B: $URL/expb.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Live Experiment B run
        if: inputs.live_run
        env:
          EXPB_URL: ${{ steps.deploy.outputs.url }}
          WISEDO_ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
        run: python3 scripts/expb_smoke.py --require-providers 1 | tee expb-summary.txt
      - name: Isolation guard (after deploy)
        if: always()
        run: node scripts/check-isolation.mjs --env "$TARGET"
      - name: Upload Experiment B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expb-${{ inputs.target }}
          path: |
            expb-status.json
            expb-profile.json
            expb-run.json
            expb-summary.txt
            deploy.log
          if-no-files-found: ignore
