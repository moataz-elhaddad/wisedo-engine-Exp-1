name: Engine tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolation guard
        run: node scripts/check-isolation.mjs && node scripts/check-isolation.mjs --env staging
      - run: node --test test/
